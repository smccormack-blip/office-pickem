<html><head><meta charset="utf-8"><title>Office Pick 'Em crest</title>
<style>

<body>
<svg id="crest" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="face"><circle cx="100" cy="100" r="60"/></clipPath>

    <path id="arcTop" d="M 23,100 A 77,77 0 0 1 177,100"/>

    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cf5d"/><stop offset="55%" stop-color="#d9a520"/><stop offset="100%" stop-color="#a87a0e"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="99" fill="url(#gold)"/>
  <circle cx="100" cy="100" r="95" fill="url(#turf)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#d9a520" stroke-width="0.8" stroke-dasharray="2 2.2"/>

  </text>
  <!-- footballs at 9 and 3 o'clock -->
  <g fill="#8b4a22" stroke="#f6f4ee" stroke-width="0.6">
    <ellipse cx="18.5" cy="100" rx="6" ry="3.6"/><ellipse cx="181.5" cy="100" rx="6" ry="3.6"/>
  </g>
  <g stroke="#f6f4ee" stroke-width="0.6"><path d="M15.5 100h6M17 98.8v2.4M18.5 98.8v2.4M20 98.8v2.4M178.5 100h6M180 98.8v2.4M181.5 98.8v2.4M183 98.8v2.4"/></g>
